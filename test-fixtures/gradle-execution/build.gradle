plugins {
    id 'application'
    id 'java'
}

application {
    mainClass = 'com.example.GradleMain'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

def engineeringMessage = providers.gradleProperty('engineeringMessage').orElse('gradle-default')

tasks.named('processResources') {
    inputs.property('engineeringMessage', engineeringMessage)
    filesMatching('engineering.properties') {
        expand(message: engineeringMessage.get())
    }
}
