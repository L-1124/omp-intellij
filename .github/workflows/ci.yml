name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --registry=https://registry.npmjs.org --replace-registry-host=always
      - run: npm exec -- biome check src scripts
      # Bound the suite without imposing a shared deadline on the cases in each file.
      - run: npm test
        timeout-minutes: 5
      - run: npm run build
      - run: npm pack --dry-run --json --ignore-scripts
